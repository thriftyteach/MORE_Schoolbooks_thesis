<title>Vocabulary Network — Range × Degree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        background: #f5f2f0;
        color: #42423f;
        font-family: 'DM Mono', 'Courier New', monospace;
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

  header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid #2c2c2a;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  h1 {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #f1efe8;
  }

  .legend {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #888780;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .controls {
    margin-left: auto;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 11px;
    color: #5f5e5a;
  }

  .btn {
    background: none;
    border: 1px solid #2c2c2a;
    color: #888780;
    font-family: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: border-color .15s, color .15s;
  }
  .btn:hover { border-color: #5f5e5a; color: #c2c0b6; }
  .btn.active { border-color: #7f77dd; color: #afa9ec; }

  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
  }

  .link {
    stroke: #e3e36d;
    stroke-width: 0.8;
    opacity: 0.6;
  }

  .link.highlighted { stroke: #5f5e5a; opacity: 1; stroke-width: 1.2; }
  .link.dimmed { opacity: 0.08; }

  .node circle {
    stroke-width: 1;
    cursor: grab;
    transition: r .2s;
  }
  .node circle:active { cursor: grabbing; }
  .node.dimmed circle { opacity: 0.12; }
  .node.dimmed text { opacity: 0.06; }

  .node text {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    fill: #d4d2c8;
    font-weight: 500;
    pointer-events: none;
    dominant-baseline: middle;
    paint-order: stroke fill;
    stroke: #1a1917;
    stroke-width: 3px;
    stroke-linejoin: round;
  }

  .node.highlighted text { fill: #f1efe8; font-weight: 700; stroke-width: 4px; }

  #tooltip {
    position: absolute;
    background: #1a1917;
    border: 1px solid #3c3489;
    border-radius: 6px;
    padding: 10px 13px;
    font-size: 11px;
    line-height: 1.7;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    min-width: 160px;
    z-index: 10;
  }

  #tooltip .word {
    font-size: 13px;
    font-weight: 700;
    color: #f1efe8;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }

  #tooltip .stat { color: #888780; }
  #tooltip .stat span { color: #c2c0b6; }

  #info {
    position: absolute;
    bottom: 16px;
    left: 20px;
    font-size: 10px;
    color: #444441;
    letter-spacing: 0.05em;
  }
</style>
</head>

<header>
  <h1>Vocabulary Network</h1>
  <div class="legend">

    <div class="legend-item"><div class="dot" style="background:#1d9e75"></div>List 3</div>
  </div>
  <div class="controls">
    <span>filter:</span>
    <button class="btn active" id="btn-all"  onclick="filterList('all')">all</button>
    <button class="btn"        id="btn-l2"   onclick="filterList('2')">list 2</button>
    <button class="btn"        id="btn-l3"   onclick="filterList('3')">list 3</button>
    <button class="btn"        id="btn-reset" onclick="resetZoom()">reset</button>
  </div>
</header>

ay","target":"visit"},{"source":"stay","target":"tent"},{"source":"stay","target":"student"},{"source":"stay","target":"top"},{"source":"stay","target":"summer"},{"source":"steal","target":"turn"},{"source":"street","target":"summer"},{"source":"street","target":"visit"},{"source":"street","target":"yesterday"},{"source":"street","target":"teacher"},{"source":"student","target":"today"},{"source":"student","target":"write"},{"source":"student","target":"young"},{"source":"summer","target":"well"},{"source":"teacher","target":"today"},{"source":"teacher","target":"write"},{"source":"teacher","target":"well"},{"source":"teacher","target":"young"},{"source":"team","target":"turn"},{"source":"team","target":"young"},{"source":"today","target":"visit"},{"source":"top","target":"write"},{"source":"travel","target":"write"},{"source":"travel","target":"young"},{"source":"waiter","target":"write"},{"source":"waiter","target":"young"},{"source":"wall","target":"write"},{"source":"wall","target":"young"},{"source":"worried","target":"young"},{"source":"yesterday","target":"young"}];

const COLOR = { "1": "#378add", "2": "#E24B4A", "3": "#FF8C00" };
const STROKE = { "1": "#185fa5", "2": "#A32D2D", "3": "#CC6600" };

const bcExtent = d3.extent(NODES, d => d.betweenness);
const rScale = d3.scaleSqrt().domain(bcExtent).range([4, 18]);

const wrap = document.getElementById("canvas-wrap");
const W = wrap.clientWidth, H = wrap.clientHeight;

const svg = d3.select("#svg");
const g = svg.append("g");

const zoom = d3.zoom()
  .scaleExtent([0.3, 4])
  .on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

const sim = d3.forceSimulation(NODES)
  .force("link", d3.forceLink(EDGES).id(d => d.id).distance(300).strength(0.4))
  .force("charge", d3.forceManyBody().strength(-100))
  .force("center", d3.forceCenter(W / 2, H / 2))
  .force("collide", d3.forceCollide().radius(d => rScale(d.betweenness) + 20));

const linkSel = g.append("g")
  .selectAll("line")
  .data(EDGES)
  .join("line")
  .attr("class", "link");

const nodeSel = g.append("g")
  .selectAll("g")
  .data(NODES)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

nodeSel.append("circle")
  .attr("r", d => rScale(d.betweenness))
  .attr("fill", d => COLOR[d.list])
  .attr("stroke", d => STROKE[d.list]);

nodeSel.append("text")
  .attr("x", d => rScale(d.betweenness) + 3)
  .attr("y", 0)
  .text(d => d.id);

const tip = document.getElementById("tooltip");

nodeSel
  .on("mouseover", (e, d) => {
    const neighbours = new Set(
      EDGES.filter(l => l.source.id === d.id || l.target.id === d.id)
           .flatMap(l => [l.source.id, l.target.id])
    );
    nodeSel.classed("dimmed",     nd => !neighbours.has(nd.id));
    nodeSel.classed("highlighted", nd => nd.id === d.id);
    linkSel.classed("highlighted", l => l.source.id === d.id || l.target.id === d.id);
    linkSel.classed("dimmed",      l => l.source.id !== d.id && l.target.id !== d.id);

    tip.innerHTML = `<div class="word">${d.id}</div>
      <div class="stat">list <span>${d.list}</span></div>
      <div class="stat">degree <span>${d.degree}</span></div>
      <div class="stat">range <span>${d.range}</span></div>
      <div class="stat">betweenness <span>${d.betweenness.toFixed(4)}</span></div>`;
    tip.style.opacity = 1;
  })
  .on("mousemove", e => {
    tip.style.left = (e.offsetX + 14) + "px";
    tip.style.top  = (e.offsetY - 10) + "px";
  })
  .on("mouseout", () => {
    nodeSel.classed("dimmed", false).classed("highlighted", false);
    linkSel.classed("highlighted", false).classed("dimmed", false);
    tip.style.opacity = 0;
  });

sim.on("tick", () => {
  linkSel
    .attr("x1", d => d.source.x).attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeSel.attr("transform", d => `translate(${d.x},${d.y})`);
});

function filterList(lst) {
  ["all","l2","l3"].forEach(id => document.getElementById("btn-"+id).classList.remove("active"));
  document.getElementById("btn-" + (lst === "all" ? "all" : "l"+lst)).classList.add("active");

  if (lst === "all") {
    nodeSel.classed("dimmed", false);
    linkSel.classed("dimmed", false);
  } else {
    nodeSel.classed("dimmed", d => d.list !== "1" && d.list !== lst);
    linkSel.classed("dimmed", l =>
      (l.source.list !== "1" && l.source.list !== lst) ||
      (l.target.list !== "1" && l.target.list !== lst));
  }
}

function resetZoom() {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}
